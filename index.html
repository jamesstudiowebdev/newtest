<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#111827;
      --text:#e5e7eb;
      --accent:#38bdf8;
      --card: rgba(255,255,255,.08);
      --card-border: rgba(255,255,255,.14);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1000px circle at 20% 10%, rgba(56,189,248,.22), transparent 45%),
                  radial-gradient(900px circle at 80% 90%, rgba(99,102,241,.18), transparent 50%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    .card{
      width:min(720px, 100%);
      background: var(--card);
      border:1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    h1{
      margin:0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.02em;
      line-height:1.1;
      text-shadow: 0 6px 24px rgba(0,0,0,.35);
    }

    h1 .accent{
      color: var(--accent);
    }

    /* small polish */
    .glow{
      display:inline-block;
      position: relative;
    }
    .glow::after{
      content:"";
      position:absolute;
      inset:-12px -16px;
      background: radial-gradient(circle at 30% 30%, rgba(56,189,248,.35), transparent 55%);
      filter: blur(14px);
      z-index:-1;
      opacity:.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="glow">Hello <span class="accent">Wlrd</span></h1>
  </div>
</body>
</html>
